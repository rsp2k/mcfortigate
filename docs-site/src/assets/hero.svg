<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-label="A stack of firewall policy rows, one of them picked out in orange, each ending in an allow or deny marker">
  <title>A firewall ruleset, read top to bottom</title>

  <g fill="none" stroke="#858c94" stroke-width="1.25">
    <!-- row 1 -->
    <rect x="26" y="20" width="430" height="40" rx="8" opacity="0.55"/>
    <!-- row 2 -->
    <rect x="26" y="72" width="430" height="40" rx="8" opacity="0.55"/>
    <!-- row 3 — the one being read -->
    <rect x="26" y="124" width="430" height="40" rx="8" stroke="#cf5a2a" stroke-width="2" fill="#cf5a2a" fill-opacity="0.1"/>
    <!-- row 4 -->
    <rect x="26" y="176" width="430" height="40" rx="8" opacity="0.55"/>
    <!-- row 5 -->
    <rect x="26" y="228" width="430" height="40" rx="8" opacity="0.55"/>
    <!-- row 6 -->
    <rect x="26" y="280" width="430" height="40" rx="8" opacity="0.55"/>
  </g>

  <!-- field bars inside each row: id, source, destination, service -->
  <g fill="#858c94" opacity="0.45">
    <rect x="42" y="34" width="18" height="12" rx="3"/>
    <rect x="76" y="34" width="74" height="12" rx="6"/>
    <rect x="162" y="34" width="52" height="12" rx="6"/>
    <rect x="226" y="34" width="96" height="12" rx="6"/>

    <rect x="42" y="86" width="18" height="12" rx="3"/>
    <rect x="76" y="86" width="58" height="12" rx="6"/>
    <rect x="146" y="86" width="88" height="12" rx="6"/>
    <rect x="246" y="86" width="44" height="12" rx="6"/>

    <rect x="42" y="190" width="18" height="12" rx="3"/>
    <rect x="76" y="190" width="90" height="12" rx="6"/>
    <rect x="178" y="190" width="46" height="12" rx="6"/>
    <rect x="236" y="190" width="70" height="12" rx="6"/>

    <rect x="42" y="242" width="18" height="12" rx="3"/>
    <rect x="76" y="242" width="46" height="12" rx="6"/>
    <rect x="134" y="242" width="104" height="12" rx="6"/>
    <rect x="250" y="242" width="58" height="12" rx="6"/>

    <rect x="42" y="294" width="18" height="12" rx="3"/>
    <rect x="76" y="294" width="80" height="12" rx="6"/>
    <rect x="168" y="294" width="62" height="12" rx="6"/>
    <rect x="242" y="294" width="86" height="12" rx="6"/>
  </g>

  <!-- the read row's fields, brighter -->
  <g fill="#cf5a2a" opacity="0.85">
    <rect x="42" y="138" width="18" height="12" rx="3"/>
    <rect x="76" y="138" width="66" height="12" rx="6"/>
    <rect x="154" y="138" width="78" height="12" rx="6"/>
    <rect x="244" y="138" width="54" height="12" rx="6"/>
  </g>

  <!-- verdict markers: allow, deny -->
  <g>
    <circle cx="434" cy="40" r="6" fill="#3fa45f"/>
    <circle cx="434" cy="92" r="6" fill="#3fa45f"/>
    <circle cx="434" cy="144" r="6" fill="#d9534f"/>
    <circle cx="434" cy="196" r="6" fill="#3fa45f"/>
    <circle cx="434" cy="248" r="6" fill="#d9534f"/>
    <circle cx="434" cy="300" r="6" fill="#3fa45f"/>
  </g>

  <!-- evaluation order runs downward -->
  <g stroke="#858c94" stroke-width="1.25" opacity="0.4" fill="none">
    <path d="M12 24 L12 312"/>
    <path d="M8 306 L12 314 L16 306"/>
  </g>

  <!-- the cursor on the row being read -->
  <path d="M4 136 L18 144 L4 152 Z" fill="#cf5a2a"/>
</svg>
